name: Publish Windows installer package
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            packages
            Installer
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Download and verify the repository installer
        run: |
          git lfs pull --include="Installer/Pratice-Code-Setup.exe" --exclude=""
          echo "0ffb04102dffce292ad6c2a48f344ee23a372f542308878ed84f447184ec3d65  Installer/Pratice-Code-Setup.exe" | sha256sum --check
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mvn --batch-mode org.apache.maven.plugins:maven-deploy-plugin:3.2.0:deploy-file
          -DpomFile=packages/pom.xml
          -Dfile=Installer/Pratice-Code-Setup.exe
          -DrepositoryId=github
          -Durl=https://maven.pkg.github.com/${{ github.repository }}
          -DretryFailedDeploymentCount=2
